llm:
  default_backend: vllm

  qwen3-8b:
      backend: vllm
      base_url: "http://localhost:8000/qwen2.5-7b"
      model: "/models/qwen2.5-7b"
      temperature: 0.7

  generation:
  max_depth: 3
  num_agents: 3
  min_props: 2
  max_props: 5
  samples_per_topic: 10
  num_topics: 20
  max_retries: 3

  output:
  file: "meta_opinions2_dataset.jsonl"
  append: true