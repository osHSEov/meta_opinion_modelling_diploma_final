model:
  name: "gpt-oss:120b"
  temperature: 0.8
  seed: 42
  #num_ctx: 131072

generation:
  max_depth: 3
  num_agents: 3
  min_props: 2
  max_props: 5
  samples_per_topic: 10
  num_topics: 20
  max_retries: 3

# Real-style generation settings (2nd depth max, more natural dialogue)
real_generation:
  max_depth: 2
  num_agents: 3
  min_props: 2
  max_props: 4
  samples_per_topic: 5
  num_topics: 10
  max_retries: 5

# Output configuration
# Set append: true to add new samples to existing dataset
# Set append: false to overwrite the dataset
output:
  file: "meta_opinions_dataset.jsonl"
  append: true
